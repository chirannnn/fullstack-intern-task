# Render Blueprint: provisions the PostgreSQL database and the API web service.
# Usage: Render Dashboard → New → Blueprint → select this repository.
databases:
  - name: template-store-db
    plan: free
    databaseName: template_store
    user: template_store

services:
  - type: web
    name: template-store-api
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm ci
    # Applies pending migrations and upserts the sample catalog (idempotent), then starts the API.
    startCommand: npm run start:prod
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: template-store-db
          property: connectionString
      # Render's internal connection does not use SSL. Set to true if you use an external URL.
      - key: DATABASE_SSL
        value: "false"
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 1d
      # Your Vercel URL, e.g. https://fullstack-intern-task.vercel.app (comma-separate several).
      - key: CORS_ORIGIN
        sync: false
      # Render sits behind one proxy hop; needed for correct client IPs in rate limiting.
      - key: TRUST_PROXY
        value: "1"
