# Docker Compose development environment for Mini SaaS Template Store.
#
#   cp .env.example .env              # once; then edit secrets in .env
#   docker compose up --build -d      # start db, server, client
#   docker compose exec server npm run db:setup   # migrate + seed (safe to repeat)
#
# Values like ${JWT_SECRET} are read from the root .env file (git-ignored).

name: template-store

services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env (copy .env.example to .env)}
      POSTGRES_DB: ${POSTGRES_DB:-template_store}
    volumes:
      # PostgreSQL 18 images keep their data under /var/lib/postgresql/<major>/.
      - db-data:/var/lib/postgresql
      # Runs only when the volume is first created: adds the <db>_test database for the test suite.
      - ./docker/postgres/initdb:/docker-entrypoint-initdb.d:ro
    ports:
      # Bound to 127.0.0.1 and to 5433 by default so it never clashes with a local PostgreSQL on 5432.
      - "127.0.0.1:${DB_PUBLISHED_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  server:
    build:
      context: ./server
    init: true
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: development
      PORT: 4000
      # Containers reach each other by service name; "localhost" would be the server container itself.
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_NAME: ${POSTGRES_DB:-template_store}
      DB_NAME_TEST: ${POSTGRES_DB:-template_store}_test
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env (copy .env.example to .env)}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-1d}
      CORS_ORIGIN: http://localhost:${WEB_PORT:-5173}
    volumes:
      # Live-reload source without rebuilding. Only code is mounted — never server/.env or node_modules.
      - ./server/src:/app/src:ro
      - ./server/migrations:/app/migrations:ro
      - ./server/seeds:/app/seeds:ro
      - ./server/tests:/app/tests:ro
    ports:
      - "${API_PORT:-4000}:4000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  client:
    build:
      context: ./client
    init: true
    restart: unless-stopped
    depends_on:
      server:
        condition: service_healthy
    environment:
      # The browser calls /api on the Vite origin; the Vite dev server forwards it over the
      # Compose network to the API. No API URL is baked into the bundle.
      VITE_DEV_API_PROXY: http://server:4000
      # File change events from host bind mounts are unreliable on Docker Desktop (Windows/macOS).
      VITE_USE_POLLING: ${VITE_USE_POLLING:-true}
    volumes:
      - ./client/src:/app/src:ro
      - ./client/public:/app/public:ro
      - ./client/index.html:/app/index.html:ro
    ports:
      - "${WEB_PORT:-5173}:5173"

volumes:
  db-data:
